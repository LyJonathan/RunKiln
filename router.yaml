models:
  # Re-benched 2026-10-15 (bench/quality pair mode, reports/2026-10-15-deepseek-v4-1-vs-glm-5-3.md), then with
  # the suite (reports/2026-10-15-suite-deepseek-v4-1-vs-glm-5-3.md: EvalPlus, LiveCodeBench v6, MATH-500,
  # AIME 2026, agentic CLI runs; 340 trials per pair, Wilson CIs, McNemar). Suite changes, only where the
  # difference is outside the noise:
  # - code.algo 68 -> 76, math 62 -> 72 (glm + 6): on the hard tier V4.1 at low/high beats glm-5-3-flash at
  #   every level, max included (88%/84% vs 72%, p < 0.001; LiveCodeBench hard and AIME carry it), and at
  #   none it matches glm:max. +6 is the conservative end (high must beat max: > +4); not the point estimate.
  # - tool.call 34 -> 58, agent 28 -> 54 (= glm): 20 agentic runs per pair, 95-100% vs glm 85-95%, no
  #   significant difference, so parity instead of a 24-point penalty that kept it out of tool turns.
  # - code.* other than algo stay glm - 2 (no difference on HumanEval+/MBPP+/legacy code/agentic edits).
  # Easy and medium tiers show no significant difference between any two pairs.
  # Thinking (same suite):
  # - max_auto_thinking high: at the 16k output cap xhigh/max truncate on 29-30 of 128 hard trials (high 15,
  #   low 11) and lose to low on the hard tier (95 vs 112 of 128, p = 0.0002) at 1.5-1.7x the cost. So auto
  #   routing stops at high in every mode (and never escalates past it on this model); /thinking or a pinned
  #   level can still pick xhigh/max.
  # - auto_off_below 0.55: the floor from difficulty 0.30 (`minimal`) has no deepseek level and rounded up to
